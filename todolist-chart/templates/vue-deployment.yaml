apiVersion: apps/v1
kind: Deployment
metadata:
  name: todolist-vue
  labels:
    app: todolist-vue
spec:
  replicas: {{ .Values.vue.replicaCount }}
  selector:
    matchLabels:
      app: todolist-vue
  template:
    metadata:
      labels:
        app: todolist-vue
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      initContainers:
        - name: wait-for-api
          image: busybox:1.35
          command: ['sh', '-c', 'until nc -z todo-api 8080; do echo waiting for api; sleep 2; done']
      containers:
        - name: todolist-vue
          image: {{ .Values.vue.image.repository }}:{{ .Values.vue.image.tag }}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          resources:
            {{- toYaml .Values.vue.resources | nindent 12 }}
          envFrom:
            - configMapRef:
                name: todolist-vue-config
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5