apiVersion: v1
kind: List
items:
  # 1. The Storage for Backups
  - apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      name: backup-pvc
    spec:
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 2Gi

  # 2. The Backup Job
  - apiVersion: batch/v1
    kind: CronJob
    metadata:
      name: backup-cronjob
    spec:
      schedule: "0 2 * * *"
      jobTemplate:
        spec:
          template:
            spec:
              restartPolicy: OnFailure
              containers:
                - name: backup
                  image: alpine:3.19
                  command:
                    - /bin/sh
                    - -c
                    - |
                      set -euo pipefail
                      DATE=$(date +%Y%m%d-%H%M)
                      DEST="/backups/${DATE}"
                      mkdir -p "${DEST}"
                      echo "Backing up to ${DEST}..."
                      cp -a /var/lib/mysql/. "${DEST}/"
                      echo "Done."
                  volumeMounts:
                    - name: db-data
                      mountPath: /var/lib/mysql
                      readOnly: true
                    - name: backup-storage
                      mountPath: /backups
              volumes:
                - name: db-data
                  persistentVolumeClaim:
                    claimName: data-backend-0  # <--- MUST match STS name (backend) + Template (data)
                - name: backup-storage
                  persistentVolumeClaim:
                    claimName: backup-pvc