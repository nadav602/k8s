apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: todolist-ingress
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - host: todolist.local
      http:
        paths:
          - path: /todos
            pathType: Prefix
            backend:
              service:
                name: todo-api
                port:
                  number: 8080 
          - path: /
            pathType: Prefix
            backend:
              service:
                name: todolist-vue
                port:
                  number: 8080 