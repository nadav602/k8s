env:
  user: "Zonenshein-Nadav"
  mysqlHost: "backend"
  apiBaseUrl: "/todos"
  mysqlRootPassword: "thisIsASecret"

api:
  replicaCount: 1
  image:
    repository: ghcr.io/bennyro-mta/todos-api
    tag: "1.2"
  service:
    type: LoadBalancer
  resources:
    requests:
      cpu: "100m"
      memory: "64Mi"
    limits:
      cpu: "200m"
      memory: "128Mi"

vue:
  replicaCount: 1
  image:
    repository: ghcr.io/bennyro-mta/todolist-vue
    tag: "1.2"
  service:
    type: LoadBalancer 
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "250m"
      memory: "256Mi"
backend:
  image: mariadb
  tag: "latest"

hpa:
  enabled: true
  minReplicas: 1
  maxReplicas: 5
  targetCPU: 50