apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../with-probes
  - ingress.yaml
  - frontend-api-deployment.yaml
  - frontend-api-service.yaml
patches:
  - path: todolist-service-patch.yaml
    target:
      kind: Service
      name: frontend-service
  - path: todolist-configmap-patch.yaml
    target:
      kind: ConfigMap
      name: todolist-config
  - path: todolist-deployment-patch.yaml
    target:
      kind: Deployment
      name: frontend