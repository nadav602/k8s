apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vue-network-policy
spec:
  podSelector:
    matchLabels:
      app: todolist-vue 
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: traefik
    ports:
    - protocol: TCP
      port: 8080