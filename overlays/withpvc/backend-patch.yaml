apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  template:
    spec:
      containers:
        - name: mariadb
          volumeMounts:
            - name: maria-persistent-storage 
              mountPath: /var/lib/mysql       
      volumes:
        - name: maria-persistent-storage     
          persistentVolumeClaim:
            claimName: maria-pvc           